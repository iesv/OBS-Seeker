name: Validate plugin in Apple Silicon OBS 32

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'Successful Apple Silicon build run ID'
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  obs-runtime:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: OBS-Seeker-macos-arm64
          path: .runtime/artifact
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Load in real Apple Silicon OBS and exit
        run: bash scripts/SmokeMac.sh
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OBS-Seeker-macos-runtime
          path: |
            .runtime/logs/*.txt
            .runtime/validation.txt
            .runtime/console.txt
          if-no-files-found: warn
          retention-days: 90
